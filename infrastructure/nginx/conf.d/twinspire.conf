# =============================================================================
# TwinSpire — Production reverse proxy
# - HTTPS termination
# - Routes / → Next.js frontend
# - Routes /api/v1 → Express backend
# - Streaming-friendly buffer settings for Next.js
# =============================================================================

upstream twinspire_frontend {
    least_conn;
    server frontend:3000 max_fails=3 fail_timeout=30s;
    keepalive 32;
}

upstream twinspire_backend {
    least_conn;
    server backend:4000 max_fails=3 fail_timeout=30s;
    keepalive 32;
}

# ---- HTTP → HTTPS redirect ---------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name twinspire.dev www.twinspire.dev;

    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
}

# ---- Main HTTPS server -------------------------------------------------------
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name twinspire.dev www.twinspire.dev;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache   shared:SSL:50m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # ---- Security headers ----
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(self)" always;
    add_header X-Request-ID $request_id always;

    # ---- Request-ID propagation ----
    proxy_set_header X-Request-Id $request_id;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Host  $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Host              $host;
    proxy_http_version 1.1;
    proxy_set_header Connection "";

    # ---- API ----
    location /api/ {
        limit_req zone=api burst=40 nodelay;
        proxy_pass http://twinspire_backend;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    location /api/v1/auth/ {
        limit_req zone=auth burst=10 nodelay;
        proxy_pass http://twinspire_backend;
    }

    # ---- Next.js static assets ----
    location /_next/static/ {
        proxy_pass http://twinspire_frontend;
        proxy_cache_valid 200 365d;
        expires 365d;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    location /_next/image {
        proxy_pass http://twinspire_frontend;
        proxy_cache_valid 200 7d;
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
    }

    # ---- Frontend ----
    location / {
        proxy_pass http://twinspire_frontend;
        proxy_buffering off;          # Next.js streaming
        proxy_read_timeout 60s;
    }

    # ---- Misc ----
    location = /robots.txt { proxy_pass http://twinspire_frontend; }
    location = /sitemap.xml { proxy_pass http://twinspire_frontend; }
    location = /favicon.ico { proxy_pass http://twinspire_frontend; access_log off; }
}
